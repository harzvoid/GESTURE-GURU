<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GestureGuru - Sign Language</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(
          145deg,
          #0a0a0a 0%,
          #1a1a2e 50%,
          #16213e 100%
        );
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      .header {
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(20px);
        padding: 12px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        cursor: move;
        user-select: none;
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
      }

      .title {
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        letter-spacing: 0.5px;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #00d4aa;
        animation: glow 2s ease-in-out infinite alternate;
        box-shadow: 0 0 10px #00d4aa, 0 0 20px rgba(0, 212, 170, 0.4);
      }

      .status-dot.inactive {
        background: #ff6b6b;
        box-shadow: 0 0 10px #ff6b6b;
        animation: none;
      }

      .status-text {
        color: #e2e8f0;
        font-size: 12px;
        font-weight: 500;
        opacity: 0.95;
      }

      @keyframes glow {
        from {
          box-shadow: 0 0 10px #00d4aa, 0 0 20px rgba(0, 212, 170, 0.4);
        }
        to {
          box-shadow: 0 0 15px #00d4aa, 0 0 30px rgba(0, 212, 170, 0.7);
        }
      }

      .canvas-container {
        flex: 1;
        position: relative;
        background: radial-gradient(ellipse at center, #1e293b 0%, #0f172a 70%);
        border-radius: 0 0 15px 15px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* Add subtle grid pattern */
      .canvas-container::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: linear-gradient(
            rgba(255, 255, 255, 0.03) 1px,
            transparent 1px
          ),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: 1;
      }

      #canvas {
        width: 100%;
        height: 100%;
        display: block;
        position: relative;
        z-index: 2;
      }

      .overlay {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85);
        color: #ffffff;
        padding: 12px 20px;
        border-radius: 25px;
        font-size: 13px;
        font-weight: 500;
        backdrop-filter: blur(15px);
        max-width: 85%;
        text-align: center;
        word-wrap: break-word;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        z-index: 10;
      }

      .overlay.show {
        opacity: 1;
        transform: translateX(-50%) translateY(-5px);
      }

      .loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #ffffff;
        z-index: 15;
        background: rgba(0, 0, 0, 0.7);
        padding: 30px 40px;
        border-radius: 20px;
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top: 4px solid #00d4aa;
        border-radius: 50%;
        animation: spin 1.2s linear infinite;
        margin: 0 auto 15px;
      }

      .loading div:last-child {
        font-size: 14px;
        font-weight: 500;
        margin-top: 10px;
        opacity: 0.9;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .error {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #ffffff;
        background: rgba(220, 38, 38, 0.9);
        padding: 25px 30px;
        border-radius: 15px;
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 10px 40px rgba(220, 38, 38, 0.3);
        z-index: 15;
      }

      .error div:first-child {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .error div:last-child {
        font-size: 11px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="header" id="header">
      <div class="title">🤟 GestureGuru</div>
      <div class="status">
        <div class="status-dot" id="statusDot"></div>
        <!-- <div class="status-text" id="statusText">Initializing...</div> -->
        <button
          id="testBtn"
          style="
            margin-left: 10px;
            padding: 4px 8px;
            background: #00d4aa;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
          "
        >
          Test Animation
        </button>
      </div>
    </div>

    <div class="canvas-container">
      <div id="canvas"></div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>Loading 3D Avatar...</div>
      </div>

      <div class="error" id="error" style="display: none">
        <div>❌ Failed to load 3D model</div>
        <div style="font-size: 10px; margin-top: 8px; opacity: 0.7">
          Please check your internet connection
        </div>
      </div>

      <div class="overlay" id="overlay">Ready to animate...</div>
    </div>

    <!-- Three.js Dependencies (Local) -->
    <script src="libs/three.min.js"></script>
    <script src="libs/GLTFLoader.js"></script>
    <!-- Load real animations from src/Animations folder -->
    <!-- Default pose -->
    <script src="Animations/defaultPose.js"></script>

    <!-- Alphabet animations -->
    <script src="Animations/Alphabets/A.js"></script>
    <script src="Animations/Alphabets/B.js"></script>
    <script src="Animations/Alphabets/C.js"></script>
    <script src="Animations/Alphabets/D.js"></script>
    <script src="Animations/Alphabets/E.js"></script>
    <script src="Animations/Alphabets/F.js"></script>
    <script src="Animations/Alphabets/G.js"></script>
    <script src="Animations/Alphabets/H.js"></script>
    <script src="Animations/Alphabets/I.js"></script>
    <script src="Animations/Alphabets/J.js"></script>
    <script src="Animations/Alphabets/K.js"></script>
    <script src="Animations/Alphabets/L.js"></script>
    <script src="Animations/Alphabets/M.js"></script>
    <script src="Animations/Alphabets/N.js"></script>
    <script src="Animations/Alphabets/O.js"></script>
    <script src="Animations/Alphabets/P.js"></script>
    <script src="Animations/Alphabets/Q.js"></script>
    <script src="Animations/Alphabets/R.js"></script>
    <script src="Animations/Alphabets/S.js"></script>
    <script src="Animations/Alphabets/T.js"></script>
    <script src="Animations/Alphabets/U.js"></script>
    <script src="Animations/Alphabets/V.js"></script>
    <script src="Animations/Alphabets/W.js"></script>
    <script src="Animations/Alphabets/X.js"></script>
    <script src="Animations/Alphabets/Y.js"></script>
    <script src="Animations/Alphabets/Z.js"></script>

    <!-- Word animations -->
    <script src="Animations/Words/HOME.js"></script>
    <script src="Animations/Words/PERSON.js"></script>
    <script src="Animations/Words/TIME.js"></script>
    <script src="Animations/Words/YOU.js"></script>

    <!-- Animation loader that organizes everything -->
    <script src="animations-loader.js"></script>
    <script src="gesture-window.js"></script>
  </body>
</html>
